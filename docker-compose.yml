version: '3.8'

services:
  proxy:
    build: ./proxy
    image: ecommerce-proxy
    ports:
      - "5000:5000"
    environment:
      - REDIS_HOST=redis-master
      # A consistência é passada para o proxy
      - CONSISTENCY_TYPE=${CONSISTENCY_TYPE:-dynamic}
      # O número de réplicas é necessário para o modo 'strong'
      - NUM_REPLICAS_FOR_STRONG=${NUM_REPLICAS:-1}
    networks:
      - rede_consistencia

  redis-master:
    image: redis:7-alpine
    networks:
      - rede_consistencia

  # As réplicas do Redis agora são criadas dinamicamente
  redis-replica:
    image: redis:7-alpine
    command: redis-server --slaveof redis-master 6379
    depends_on:
      - redis-master
    networks:
      - rede_consistencia
    deploy:
      # O número de réplicas é definido pela variável de ambiente
      replicas: ${NUM_REPLICAS:-1}

  avaliacoes:
    build: ./client_runner
    image: experimento-cliente
    depends_on:
      - proxy
    environment:
      - SERVICE_NAME=avaliacoes
      - NUM_REQUESTS=${NUM_REQUESTS:-1000}
      - NODE_ID=avaliacoes-{{.Task.Slot}}
    networks:
      - rede_consistencia
    volumes:
      - ${LOG_DIR_CLIENTS:-./logs}:/app/logs
    deploy:
      replicas: 2

  catalogo:
    build: ./client_runner
    image: experimento-cliente
    depends_on:
      - proxy
    environment:
      - SERVICE_NAME=catalogo
      - NUM_REQUESTS=${NUM_REQUESTS:-1000}
      - NODE_ID=catalogo-{{.Task.Slot}}
    networks:
      - rede_consistencia
    volumes:
      - ${LOG_DIR_CLIENTS:-./logs}:/app/logs
    deploy:
      replicas: 2
      # ...

  pagamentos:
    build: ./client_runner
    image: experimento-cliente
    depends_on:
      - proxy
    environment:
      - SERVICE_NAME=pagamentos
      - NUM_REQUESTS=${NUM_REQUESTS:-1000}
      - NODE_ID=pagamentos-{{.Task.Slot}}
    networks:
      - rede_consistencia
    volumes:
      - ${LOG_DIR_CLIENTS:-./logs}:/app/logs
    deploy:
      replicas: 1
      # ...

  pedidos:
    build: ./client_runner
    image: experimento-cliente
    depends_on:
      - proxy
    environment:
      - SERVICE_NAME=pedidos
      - NUM_REQUESTS=${NUM_REQUESTS:-1000}
      - NODE_ID=pedidos-{{.Task.Slot}}
    networks:
      - rede_consistencia
    volumes:
      - ${LOG_DIR_CLIENTS:-./logs}:/app/logs
    deploy:
      replicas: 1
      # ...

networks:
  rede_consistencia:
    driver: overlay
    attachable: true