version: '3.8'

services:
  proxy:
    build: ./proxy
    image: ecommerce-proxy # Nome da imagem que será construída
    ports:
      - "5000:5000"
    environment:
      - REDIS_HOST=redis-master
    networks:
      - rede_consistencia

  redis-master:
    image: redis:7-alpine
    networks:
      - rede_consistencia

  # A primeira réplica sempre estará ativa
  redis-replica-1:
    image: redis:7-alpine
    command: redis-server --slaveof redis-master 6379
    depends_on: [redis-master]
    networks: [rede_consistencia]

  # A segunda réplica só será ativada com o profile "2-ou-mais-replicas"
  redis-replica-2:
    image: redis:7-alpine
    command: redis-server --slaveof redis-master 6379
    depends_on: [redis-master]
    networks: [rede_consistencia]
    profiles: ["2-ou-mais-replicas", "4-replicas"]

  # As réplicas 3 e 4 só serão ativadas com o profile "4-replicas"
  redis-replica-3:
    image: redis:7-alpine
    command: redis-server --slaveof redis-master 6379
    depends_on: [redis-master]
    networks: [rede_consistencia]
    profiles: ["4-replicas"]

  redis-replica-4:
    image: redis:7-alpine
    command: redis-server --slaveof redis-master 6379
    depends_on: [redis-master]
    networks: [rede_consistencia]
    profiles: ["4-replicas"]

  # avaliacoes:
  #   build: ./client_runner # Define o contexto para construir a imagem
  #   image: experimento-cliente # Nomeia a imagem que será construída
  #   depends_on:
  #     - proxy
  #   environment:
  #     - SERVICE_NAME=avaliacoes
  #     - CONSISTENCY_TYPE=eventual
  #     - NODE_ID=avaliacoes-{{.Task.Slot}}
